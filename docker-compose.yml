services:
  app:
    build:
      context: .
    ports:
      - "${HOST_SIDE_PORT:-5001}:${CONTAINER_INTERNAL_SIDE_PORT:-5000}"
      - "${SSL_PORT:-9898}:${SSL_PORT:-9898}"
    environment:
      - PORT=${CONTAINER_INTERNAL_SIDE_PORT:-5000}
      - PUID=1000
      - PGID=1000
      # - SQLITE_DB_PATH=/app/data/sqlite.db  # Default path for sqlite db, uncomment and change if needed
      # - QUESTARR_BASE_PATH=/Questarr  # Serve from a subdirectory behind a reverse proxy, see docs/REVERSE_PROXY.md
    volumes:
      - /srv/docker/Questarr/data:/app/data
      - /mnt/media/Complete:/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:' + (process.env.PORT || 5000) + '/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
