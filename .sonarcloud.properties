# SonarCloud Automatic Analysis reads this file and ignores sonar-project.properties.
# Keep these paths in sync with sonar-project.properties so test files and generated
# migrations stay out of the analysis and the duplication gate.
sonar.sources=client/src,server,shared
sonar.sourceEncoding=UTF-8

sonar.exclusions=**/__tests__/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,tests/**,playwright/**
sonar.cpd.exclusions=**/__tests__/**,**/*.test.ts,**/*.test.tsx,migrations/**,migrations-pg/**,playwright/**
